
  <div class="content-wrapper">
      <!-- Content Header (Page header) -->
      <div class="content-header">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-sm-6">
              <h1 class="m-0">Department</h1>
            </div><!-- /.col -->
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-right">
                <li class="breadcrumb-item"><a routerLink="/home">Home</a></li>
                <li class="breadcrumb-item active"><a href="#">Department</a></li>
              </ol>
            </div><!-- /.col -->
          </div><!-- /.row -->
        </div><!-- /.container-fluid -->
      </div>
      <!-- /.content-header -->
  
      <!-- Main content -->
      <section class="content">
        <div class="container-fluid">
          <!-- Small boxes (Stat box) -->
          <div class="row justify-content-end p-3">
            <button mat-raised-button color="primary" data-toggle="modal" data-target="#exampleModal">+ Department</button>
        </div> 
            <div class="mat-elevation-z8">
                <form class="example-form">
                    <mat-form-field class="example-full-width">
                      <mat-label>Search Here</mat-label>
                      <input matInput (keyup)="FilterChange($event)" placeholder="Search">
                    </mat-form-field>
                </form>   
                <table matSort mat-table [dataSource]="dataSource">
              
                  
                  <!-- Serial number Column -->
                  <ng-container matColumnDef="Sl">
                    <th mat-header-cell *matHeaderCellDef class="text-center"> Sl. No. </th>
                    <td mat-cell *matCellDef="let element let i = index;" class="text-center">
                         {{ paginator.pageIndex*paginator.pageSize + (i + 1) }} 
                    </td>
                  </ng-container>

                  <!-- Name Column -->
                  <ng-container matColumnDef="dept_name">
                    <th mat-sort-header mat-header-cell *matHeaderCellDef class="text-center"> Department Name </th>
                    <td mat-cell *matCellDef="let element"> {{element.dept_name}} </td>
                  </ng-container>
              
                 <!-- Action Column -->
                 <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef class="text-center"> Action </th>
                    <td mat-cell *matCellDef="let row" class="text-center"> 
                        <button (click)="showDeptUpdateModal(row)" data-toggle="modal" data-target="#DeptUpdate" mat-raised-button color="primary">Edit</button>
                        <button mat-raised-button color="warn">Delete</button>
                     </td>
                  </ng-container>
                  
              
                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
              
                <mat-paginator [pageSizeOptions]="[10, 20, 50]"
                               showFirstLastButtons
                               aria-label="Select page of periodic elements">
                </mat-paginator>
              </div>
              
          
          <!-- Main row -->
          <div class="row">
           
          </div>
          <!-- /.row (main row) -->
        </div><!-- /.container-fluid -->
      </section>
      <!-- /.content -->
      <!-- Add Modal -->
      <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
          <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Add Department</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">

              <div class="form-group row">
                <label  class="col-sm-4 col-form-label">Department Name:</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control"  [(ngModel)]="departmentData.dept_name" required="required" placeholder="Department Name">
                </div>
              </div>
              <div class="form-group row">
                <div class="col-sm-12">
                  <button type="submit" (click)="save()" class="btn btn-block btn-primary">Sumbit</button>
                </div>
                <div class="col-sm-12">
                  <button type="button" id="modalClose" class="btn btn-link danger btn-block" data-dismiss="modal">Cancel</button>
                </div>
              </div>
          </div>
        </div>
      </div>
    </div>
    <!-- update Modal -->
    <div class="modal fade" id="DeptUpdate" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Update Department</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">

            <div class="form-group row">
              <label  class="col-sm-4 col-form-label">Department Name:</label>
              <div class="col-sm-8">
                <input type="text" class="form-control"  [(ngModel)]="selectedDept.dept_name" required="required" placeholder="Department Name">
              </div>
            </div>
            <div class="form-group row">
              <div class="col-sm-12">
                <button type="submit" (click)="update()" class="btn btn-block btn-primary">Update</button>
              </div>
              <div class="col-sm-12">
                <button type="button" id="modalClosed" class="btn btn-danger btn-block" data-dismiss="modal">Cancel</button>
              </div>
            </div>
        </div>
      </div>
    </div>
  </div>
    </div>
